<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday, Princess Betelhem</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style id='luxury-elegant-redesign'>
/* Luxury editorial redesign */
:root {
  --ink:#2a2021; --wine:#542b39; --wine-deep:#351b27; --gold:#c7a56a;
  --gold-light:#ead8ad; --cream:#fbf6ed; --paper:#fffaf2; --muted:#786b68;
  --line:rgba(150,112,65,.30); --shadow:0 24px 70px rgba(48,27,31,.16);
}
html { scroll-behavior:smooth; }
body {
  background:
    radial-gradient(ellipse at 12% 5%, rgba(225,198,150,.22), transparent 34%),
    radial-gradient(ellipse at 92% 90%, rgba(112,55,72,.11), transparent 30%),
    var(--cream) !important;
  color:var(--ink) !important;
  font-family:"Cormorant Garamond", Georgia, "Times New Roman", serif !important;
  letter-spacing:.015em;
}
body:before {
  content:""; position:fixed; inset:12px; border:1px solid rgba(174,137,79,.35);
  pointer-events:none; z-index:9998; border-radius:2px;
}
h1,h2,h3,.title,.heading {
  font-family:"Cormorant Garamond", Georgia, serif !important;
  letter-spacing:.025em; font-weight:500 !important;
}
h1 { font-size:clamp(2.7rem,7vw,5.8rem) !important; line-height:.98 !important; }
h2 { font-size:clamp(2rem,4vw,3.3rem) !important; }
p { line-height:1.8; }
button, .btn, a.button, input[type=button] {
  border:1px solid var(--gold) !important;
  background:linear-gradient(135deg,var(--wine),var(--wine-deep)) !important;
  color:#fff8ec !important; border-radius:999px !important;
  padding:13px 24px !important; letter-spacing:.07em !important;
  text-transform:uppercase; font-size:.78rem !important;
  box-shadow:0 8px 22px rgba(65,31,43,.18);
  transition:transform .25s ease, box-shadow .25s ease !important;
}
button:hover,.btn:hover,a.button:hover { transform:translateY(-2px); box-shadow:0 13px 28px rgba(65,31,43,.25); }
a { color:var(--wine) !important; }
section, .page, .book-page, .card, .memory-card, .paper, .letter, .chapter, .music-card {
  border-color:var(--line) !important;
}
.page, .book-page, .card, .memory-card, .paper, .letter, .chapter, .music-card {
  background:linear-gradient(145deg,rgba(255,252,246,.97),rgba(247,237,219,.94)) !important;
  border:1px solid var(--line) !important;
  box-shadow:var(--shadow) !important;
  border-radius:8px !important;
}
img { border-radius:5px !important; }
.cover, .front-page, .hero, #cover, .book-cover {
  background:
    radial-gradient(ellipse at center, rgba(255,249,235,.95) 0%, rgba(246,231,205,.94) 48%, rgba(225,201,157,.92) 100%) !important;
  border:1px solid rgba(168,128,70,.55) !important;
  box-shadow:0 25px 80px rgba(59,34,35,.20) !important;
}
.cover:after, .front-page:after, .hero:after, #cover:after, .book-cover:after {
  content:"✦  ✧  ✦"; display:block; color:var(--gold); letter-spacing:.8em;
  margin:24px auto 0; font-size:1rem;
}
#play, #playSong, .play-song, button[aria-label*="Play"], .music-button {
  font-size:.9rem !important; padding:17px 34px !important;
}
hr { border:0; border-top:1px solid var(--line); }
small,.subtitle,.caption { color:var(--muted) !important; letter-spacing:.08em; }
@media(max-width:600px) {
  body:before { inset:5px; }
  .page,.book-page,.card,.memory-card,.paper,.letter,.chapter,.music-card { padding:22px !important; }
}
</style>
</head><body class="luxury-elegant-birthday"><main><h1>Happy Birthday to Princess Betelhem</h1><p>A little world made with love by Biruk Dessalegn Berhe.</p><p>Betelhem Rediet Yimer, almost three years of memories, studying and graduating together, and many more beautiful chapters to come.</p><h2>Happy Birthday to Beti</h2><button id="play">Play Song</button><audio id="song" controls></audio><p>With love, Biruk Dessalegn Berhe ❤️</p></main></body></html>
